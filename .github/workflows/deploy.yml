name: Publish public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Preserve existing public illustrations
        run: |
          python3 bootstrap-assets.py
          git config user.name "SailingLabs publishing"
          git config user.email "actions@users.noreply.github.com"
          git add site
          if ! git diff --cached --quiet; then
            git commit -m "Preserve verified public illustration assets"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
